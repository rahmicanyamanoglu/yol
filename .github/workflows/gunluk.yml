name: Günlük kent verisi

on:
  schedule:
    - cron: "17 9 * * *"   # her gün 09:17 UTC (Vikipedi sayıları o saate kadar yayımlanmış olur)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gunluk
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dünün verisini çek
        run: python3 scripts/gunluk.py

      - name: Değiştiyse kaydet
        run: |
          if git diff --quiet -- _data/gunluk.json; then
            echo "Yeni veri yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/gunluk.json
          git commit -m "Günlük kent verisi: $(date -u +%F)"
          git push
