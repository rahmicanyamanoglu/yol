name: Obsidian ekleri

# Obsidian'da notlara sürüklenen fotoğraflar _yazilar/ekler/ altına düşer;
# o klasör yayımlanmadığı için buraya, assets/img/yazilar/ altına kopyalanır.
on:
  push:
    branches: [main]
    paths: ["_yazilar/ekler/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kopyala:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekleri yayımlanan klasöre kopyala
        run: |
          mkdir -p assets/img/yazilar
          rsync -a --delete --exclude .gitkeep _yazilar/ekler/ assets/img/yazilar/
          git add -A assets/img/yazilar
          if git diff --cached --quiet; then echo "Değişen ek yok."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Obsidian eklerini yayımla"
          git pull --rebase origin main
          git push
