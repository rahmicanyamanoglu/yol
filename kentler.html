---
layout: default
title: Görünmez Kentler
permalink: /kentler/
harita: true
---
<section class="giris">
    <h1>Görünmez Kentler</h1>
    <p>Gittiğim yerlerin zihnimdeki halleri. Her gün o günün havasıyla değişirler.</p>
</section>

<div class="kentler" id="kentler"></div>

<dialog id="kent" class="kent-pencere" aria-labelledby="kent-ad">
    <div class="kent-ust">
        <div>
            <p class="kent-tur" id="kent-tur"></p>
            <h2 id="kent-ad"></h2>
            <p class="kent-yer" id="kent-yer"></p>
        </div>
        <button type="button" class="kapat" id="kapat" aria-label="Kapat">×</button>
    </div>
    <div class="kent-govde">
        <div class="kent-sahne">
            <svg id="kent-svg" viewBox="0 0 600 600" role="img" aria-label="Hayali kent çizimi"></svg>
            <div id="kent-harita" class="kent-harita" hidden></div>
        </div>
        <div class="kent-yan">
            <div class="gecis" role="group" aria-label="Görünüm">
                <button type="button" data-mod="gorunmez" aria-pressed="true">Görünmez</button>
                <button type="button" data-mod="gorunen" aria-pressed="false">Görünen</button>
            </div>
            <button type="button" class="ses-dugme" id="kent-ses" aria-pressed="true">Ses açık</button>
            <p class="anlati"><span>Marco Polo anlatır</span><span id="kent-anlati"></span></p>
            <p class="gunluk" id="kent-gunluk"></p>
            <p class="ipucu" id="kent-ipucu">Dokun, bir şey ekle.</p>
            <p class="kent-eylem">
                <button type="button" class="dugme sade" id="kent-sil">Temizle</button>
                <a class="dugme dolu" id="kent-link" href="#">Hikâyeye git →</a>
            </p>
        </div>
    </div>
</dialog>

<noscript><p class="bos">Kentleri görmek için JavaScript gerekiyor.</p></noscript>

<script>
window.YOL_KENTLER = [
{%- for post in site.posts reversed -%}
{%- if post.konum -%}
{%- assign dolu = post.content | strip_html | strip | size -%}
  { "baslik": {{ post.title | jsonify }}, "slug": {{ post.slug | jsonify }}, "yer": {{ post.yer | jsonify }}, "donem": {{ post.donem | jsonify }}, "url": {{ post.url | relative_url | jsonify }}, "konum": {{ post.konum | jsonify }}, "kent": {{ post.kent | jsonify }}, "hayal_adi": {{ post.hayal_adi | jsonify }}, "hayal": {{ post.hayal | jsonify }}, "sesler": {{ post.sesler | jsonify }}, "gunler": {{ site.data.gunluk.kentler[post.slug] | jsonify }}, "dolu": {% if dolu > 0 %}true{% else %}false{% endif %} },
{%- endif -%}
{%- endfor -%}
];
</script>
<script src="{{ '/assets/leaflet/leaflet.js' | relative_url }}"></script>
<script src="{{ '/assets/ses.js' | relative_url }}"></script>
<script src="{{ '/assets/kentler.js' | relative_url }}"></script>
